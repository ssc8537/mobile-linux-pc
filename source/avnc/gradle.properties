# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.useAndroidX=true
android.enableR8.fullMode=false
android.injected.androidTest.leaveApksInstalledAfterRun=true
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# --- local fork additions (Windows sandbox / non-ASCII workspace path) ---
# The checkout lives under a path containing CJK characters; AGP refuses that by default.
android.overridePathCheck=true
# The file-watcher cannot start its native event loop in the sandbox ("Couldn't open current thread, error = 5").
org.gradle.vfs.watch=false
